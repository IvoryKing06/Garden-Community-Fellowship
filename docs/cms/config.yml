# Phase 2 DRAFT: do not publish under public/admin until GitHub OAuth is configured,
# the named administrators have MFA, and protected publishing has been tested.
backend:
  name: github
  repo: IvoryKing06/Garden-Community-Fellowship
  branch: main

publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
show_preview_links: false

collections:
  - name: church_updates
    label: Church Updates
    files:
      - name: announcements
        label: Announcements
        file: src/data/editorial/announcements.json
        format: json
        fields:
          - name: announcements
            label: Announcements
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: Stable ID, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use a lowercase, hyphenated ID'] }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Message, widget: text }
              - { name: expiresAt, label: Expiration date, widget: date, format: 'YYYY-MM-DD', required: false }
      - name: gatherings
        label: Services and Events
        file: src/data/editorial/gatherings.json
        format: json
        fields:
          - name: gatherings
            label: Events and regular gatherings
            widget: list
            summary: "{{fields.title}} — {{fields.day}}"
            hint: Keep the confirmed schedule; leave uncertain information clearly unconfirmed.
            fields:
              - { name: id, label: Stable ID, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use a lowercase, hyphenated ID'] }
              - { name: title, label: Event title, widget: string }
              - { name: day, label: Day or recurrence label, widget: string }
              - { name: time, label: Confirmed time or pending message, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: category, label: Category, widget: string }
              - { name: recurrence, label: Recurrence, widget: select, options: [weekly, monthly, unconfirmed] }
              - { name: date, label: Specific date, widget: date, format: 'YYYY-MM-DD', required: false }
              - { name: location, label: Location, widget: string, required: false }
              - name: image
                label: Optional event image
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image }
                  - { name: alt, label: Describe image, widget: string }
                  - { name: width, label: Image width in pixels, widget: number, value_type: int, min: 1 }
                  - { name: height, label: Image height in pixels, widget: number, value_type: int, min: 1 }
      - name: ministries
        label: Ministries
        file: src/data/editorial/ministries.json
        format: json
        fields:
          - name: ministries
            label: Ministry listings
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: Stable ID, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use a lowercase, hyphenated ID'] }
              - { name: name, label: Ministry name, widget: string }
              - { name: category, label: Category, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: symbol, label: Number/short symbol, widget: string }
              - { name: schedule, label: Schedule, widget: string, required: false }
              - name: image
                label: Optional ministry image
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image }
                  - { name: alt, label: Describe image, widget: string }
                  - { name: width, label: Image width in pixels, widget: number, value_type: int, min: 1 }
                  - { name: height, label: Image height in pixels, widget: number, value_type: int, min: 1 }
      - name: sermons
        label: Sermon Recordings
        file: src/data/editorial/sermons.json
        format: json
        fields:
          - name: sermons
            label: Individual recordings
            widget: list
            summary: "{{fields.title}}"
            hint: Each recording needs its specific YouTube watch or youtu.be URL, not a channel URL.
            fields:
              - { name: id, label: Stable ID, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use a lowercase, hyphenated ID'] }
              - { name: title, label: Sermon title, widget: string }
              - { name: recordedOn, label: Recorded date, widget: date, format: 'YYYY-MM-DD', required: false }
              - { name: youtubeUrl, label: Individual YouTube video URL, widget: string, pattern: ['^https://(www\.)?(youtube\.com/watch\?v=|youtu\.be/)', 'Use an HTTPS link to an individual YouTube video'] }
              - name: image
                label: Optional sermon image
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image }
                  - { name: alt, label: Describe image, widget: string }
                  - { name: width, label: Image width in pixels, widget: number, value_type: int, min: 1 }
                  - { name: height, label: Image height in pixels, widget: number, value_type: int, min: 1 }
      - name: participation
        label: Bible Studies and Involvement
        file: src/data/editorial/participation.json
        format: json
        fields:
          - name: bibleStudies
            label: Bible Studies
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: Stable ID, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: schedule, label: Schedule, widget: string, required: false }
          - name: outreach
            label: Outreach
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: Stable ID, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: schedule, label: Schedule, widget: string, required: false }
          - name: volunteerOpportunities
            label: Volunteer Opportunities
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: Stable ID, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: schedule, label: Schedule, widget: string, required: false }
